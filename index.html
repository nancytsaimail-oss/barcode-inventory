<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>庫存進貨系統3</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Quagga2 一維條碼專用掃描套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  <!-- SheetJS (xlsx.full.min.js) 套件 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* 修正 Quagga 產生的相機畫面顯示大小 */
    #interactive.viewport video, #interactive.viewport canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      border-radius: 0.5rem;
    }
    #interactive.viewport {
      position: relative;
      width: 100%;
      height: 250px;
      overflow: hidden;
      background-color: #000;
      border-radius: 0.5rem;
    }
    /* 繪製綠色對焦框指示 */
    .drawingBuffer {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
  <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-md p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">📦 庫存進貨系統</h1>

    <!-- 功能 1: 相機掃描條碼區域 -->
    <div class="mb-8 p-4 border border-gray-200 rounded-lg bg-gray-50">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold text-gray-700">相機掃描商品條碼 (Quagga2 高效版)</h2>
        <button id="btn-toggle-camera" type="button" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded transition">
          開啟/關閉相機
        </button>
      </div>

      <!-- 錯誤訊息提示區 -->
      <div id="camera-error" class="hidden mb-3 p-3 bg-red-100 border border-red-300 text-red-700 rounded text-sm"></div>

      <!-- Quagga 視訊區域 -->
      <div id="interactive" class="viewport"></div>
      <p class="text-xs text-gray-500 text-center mt-2">請將商品條碼水平放置於鏡頭中央 (保持約 15 公分距離)</p>
    </div>

    <!-- 單筆進貨表單 -->
    <form id="single-entry-form" class="space-y-4 mb-8">
      <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">單筆進貨填寫</h2>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">商品條碼</label>
        <input type="text" id="barcode" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-yellow-50 text-blue-900 font-bold" placeholder="對準條碼自動填入，或手動輸入">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">商品名稱</label>
        <input type="text" id="product-name" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例如：無印良品筆記本">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">進貨數量</label>
          <input type="number" id="quantity" min="1" value="1" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">單價</label>
          <input type="number" id="unit-price" min="0" step="0.1" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0">
        </div>
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition">
        確認進貨
      </button>
    </form>

    <hr class="my-8">

    <!-- 功能 2: Excel 批次匯入區域 -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-700">Excel / CSV 批次匯入</h2>
      <div>
        <input type="file" id="excel-file" accept=".xlsx, .csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
      </div>

      <!-- 預覽表格 -->
      <div id="preview-container" class="hidden space-y-4 overflow-x-auto">
        <h3 class="text-md font-medium text-gray-700">資料預覽</h3>
        <table class="min-w-full divide-y divide-gray-200 border">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">條碼</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">商品名稱</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">數量</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">單價</th>
            </tr>
          </thead>
          <tbody id="preview-body" class="bg-white divide-y divide-gray-200 text-sm"></tbody>
        </table>
        <button id="btn-batch-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-md transition">
          確認批次進貨
        </button>
      </div>
    </div>
  </div>

  <script>
    // Google Apps Script Web App URL
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyrdD8MCcwx80jnC6BGXNUKEJ6pwp8KuogbjMm0MBZTh_yQLhbWV5hj7rJXE25CbwfqRA/exec";

    // 嗶聲提示 (Web Audio API)
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.value = 1400;
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {
        console.warn("Audio Error:", e);
      }
    }

    // ===== Quagga2 一維條碼專用初始化 =====
    let isCameraRunning = false;
    let lastScannedCode = "";
    let lastScannedTime = 0;

    function initQuagga() {
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        document.getElementById('camera-error').textContent = "⚠️ 注意：手機瀏覽器強制要求必須在 HTTPS 安全網址下才能使用相機對焦。";
        document.getElementById('camera-error').classList.remove('hidden');
        return;
      }

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector("#interactive"),
          constraints: {
            facingMode: "environment", // 使用後鏡頭
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        },
        locator: {
          patchSize: "medium",
          halfSample: true
        },
        numOfWorkers: 2,
        decoder: {
          readers: [
            "ean_reader",      // 台灣/日本常用商品 13 碼條碼 (JAN / EAN-13)
            "ean_8_reader",    // 8 碼條碼
            "code_128_reader", // 物流/一般商品 128 條碼
            "upc_reader"       // 美規 UPC 條碼
          ]
        },
        locate: true
      }, function(err) {
        if (err) {
          console.error("Quagga 初始化失敗:", err);
          document.getElementById('camera-error').textContent = "❌ 無法啟動相機：" + err;
          document.getElementById('camera-error').classList.remove('hidden');
          return;
        }
        Quagga.start();
        isCameraRunning = true;
      });

      // 監聽成功辨識事件
      Quagga.onDetected(function(result) {
        if (!result || !result.codeResult) return;

        const code = result.codeResult.code;
        const now = Date.now();

        // 防止 2 秒內重複觸發
        if (code === lastScannedCode && (now - lastScannedTime) < 2000) {
          return;
        }

        lastScannedCode = code;
        lastScannedTime = now;

        playBeep();
        
        // 帶入條碼
        const barcodeInput = document.getElementById('barcode');
        barcodeInput.value = code;

        // 輸入框綠色閃爍效果
        barcodeInput.classList.add('bg-green-200');
        setTimeout(() => barcodeInput.classList.remove('bg-green-200'), 500);
      });
    }

    function stopQuagga() {
      if (isCameraRunning) {
        Quagga.stop();
        isCameraRunning = false;
      }
    }

    document.getElementById('btn-toggle-camera').addEventListener('click', () => {
      if (isCameraRunning) {
        stopQuagga();
      } else {
        initQuagga();
      }
    });

    // 頁面開啟自動啟動相機
    window.addEventListener('DOMContentLoaded', () => {
      initQuagga();
    });

    // 表單提交：單筆進貨
    document.getElementById('single-entry-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const payload = [{
        barcode: document.getElementById('barcode').value,
        name: document.getElementById('product-name').value,
        quantity: document.getElementById('quantity').value,
        price: document.getElementById('unit-price').value
      }];
      
      sendDataToGAS(payload);
    });

    // ===== 功能 2: Excel 檔案讀取與預覽 =====
    let batchData = [];

    document.getElementById('excel-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet);

        batchData = jsonData.map(row => ({
          barcode: row['條碼'] || row['Barcode'] || '',
          name: row['商品名稱'] || row['Name'] || '',
          quantity: row['數量'] || row['Quantity'] || 0,
          price: row['單價'] || row['Price'] || 0
        }));

        renderPreviewTable(batchData);
      };
      reader.readAsArrayBuffer(file);
    });

    function renderPreviewTable(data) {
      const tbody = document.getElementById('preview-body');
      tbody.innerHTML = '';

      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="px-4 py-2">${item.barcode}</td>
          <td class="px-4 py-2">${item.name}</td>
          <td class="px-4 py-2">${item.quantity}</td>
          <td class="px-4 py-2">${item.price}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('preview-container').classList.remove('hidden');
    }

    document.getElementById('btn-batch-submit').addEventListener('click', function() {
      if (batchData.length === 0) {
        alert("無可匯入的資料");
        return;
      }
      sendDataToGAS(batchData);
    });

    // ===== 功能 3: 傳送資料至 Google Apps Script API =====
    function sendDataToGAS(dataArray) {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL")) {
        alert("請先設定 GAS_WEB_APP_URL 網址！");
        return;
      }

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(dataArray)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          alert(`成功上傳 ${res.count} 筆進貨資料！`);
          document.getElementById('single-entry-form').reset();
          document.getElementById('preview-container').classList.add('hidden');
          document.getElementById('excel-file').value = '';
          batchData = [];
        } else {
          alert('儲存失敗：' + res.message);
        }
      })
      .catch(err => {
        console.error(err);
        alert('發生錯誤，請查看 Console log');
      });
    }
  </script>
</body>
</html>
