<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>庫存進貨系統3</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Quagga2 一維條碼專用掃描套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  <!-- SheetJS (xlsx.full.min.js) 套件 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* 修正 Quagga 產生的相機畫面顯示大小 */
    #interactive.viewport video, #interactive.viewport canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      border-radius: 0.5rem;
    }
    #interactive.viewport {
      position: relative;
      width: 100%;
      height: 250px;
      overflow: hidden;
      background-color: #000;
      border-radius: 0.5rem;
    }
    /* 繪製綠色對焦框指示 */
    .drawingBuffer {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
  <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-md p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">📦 庫存進貨系統</h1>

    <!-- 功能 1: 相機掃描條碼區域 -->
    <div class="mb-8 p-4 border border-gray-200 rounded-lg bg-gray-50">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold text-gray-700">相機掃描商品條碼 (Quagga2 高效版)</h2>
        <button id="btn-toggle-camera" type="button" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded transition">
          開啟/關閉相機
        </button>
      </div>

      <!-- 錯誤訊息提示區 -->
      <div id="camera-error" class="hidden mb-3 p-3 bg-red-100 border border-red-300 text-red-700 rounded text-sm"></div>

      <!-- Quagga 視訊區域 -->
      <div id="interactive" class="viewport"></div>
      <p class="text-xs text-gray-500 text-center mt-2">請將商品條碼水平放置於鏡頭中央 (保持約 15 公分距離)</p>
    </div>

    <!-- 單筆進貨表單 -->
    <form id="single-entry-form" class="space-y-4 mb-8">
      <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">單筆進貨填寫</h2>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">商品條碼</label>
        <input type="text" id="barcode" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-yellow-50 text-blue-900 font-bold" placeholder="對準條碼自動填入，或手動輸入">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">商品名稱</label>
        <input type="text" id="product-name" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例如：草莓口香糖">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">進貨數量</label>
          <input type="number" id="quantity" min="1" value="1" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">單價</label>
          <input type="number" id="unit-price" min="0" step="0.1" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0">
        </div>
      </div>
      <button id="btn-submit-single" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition">
        確認進貨
      </button>
    </form>

    <hr class="my-8">

    <!-- 功能 2: Excel / CSV 批次匯入區域 -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-700">Excel / CSV 批次匯入</h2>
      <div>
        <input type="file" id="excel-file" accept=".xlsx, .xls, .csv, .tsv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
      </div>

      <!-- 預覽表格 -->
      <div id="preview-container" class="hidden space-y-4 overflow-x-auto">
        <h3 class="text-md font-medium text-gray-700">資料預覽</h3>
        <table class="min-w-full divide-y divide-gray-200 border">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">條碼</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">商品名稱</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">數量</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">單價</th>
            </tr>
          </thead>
          <tbody id="preview-body" class="bg-white divide-y divide-gray-200 text-sm"></tbody>
        </table>
        <button id="btn-batch-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-md transition">
          確認批次進貨
        </button>
      </div>
    </div>
  </div>

  <script>
    // Google Apps Script Web App URL
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyrdD8MCcwx80jnC6BGXNUKEJ6pwp8KuogbjMm0MBZTh_yQLhbWV5hj7rJXE25CbwfqRA/exec";

    // 嗶聲提示
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.value = 1400;
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {
        console.warn("Audio Error:", e);
      }
    }

    // ===== Quagga2 相機掃描 =====
    let isCameraRunning = false;
    let lastScannedCode = "";
    let lastScannedTime = 0;

    function initQuagga() {
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        document.getElementById('camera-error').textContent = "⚠️ 注意：手機瀏覽器強制要求必須在 HTTPS 安全網址下才能使用相機對焦。";
        document.getElementById('camera-error').classList.remove('hidden');
        return;
      }

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector("#interactive"),
          constraints: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        },
        locator: { patchSize: "medium", halfSample: true },
        numOfWorkers: 2,
        decoder: {
          readers: ["ean_reader", "ean_8_reader", "code_128_reader", "upc_reader"]
        },
        locate: true
      }, function(err) {
        if (err) {
          console.error("Quagga 初始化失敗:", err);
          document.getElementById('camera-error').textContent = "❌ 無法啟動相機：" + err;
          document.getElementById('camera-error').classList.remove('hidden');
          return;
        }
        Quagga.start();
        isCameraRunning = true;
      });

      Quagga.onDetected(function(result) {
        if (!result || !result.codeResult) return;
        const code = result.codeResult.code;
        const now = Date.now();
        if (code === lastScannedCode && (now - lastScannedTime) < 2000) return;

        lastScannedCode = code;
        lastScannedTime = now;
        playBeep();
        
        const barcodeInput = document.getElementById('barcode');
        barcodeInput.value = code;
        barcodeInput.classList.add('bg-green-200');
        setTimeout(() => barcodeInput.classList.remove('bg-green-200'), 500);
      });
    }

    function stopQuagga() {
      if (isCameraRunning) {
        Quagga.stop();
        isCameraRunning = false;
      }
    }

    document.getElementById('btn-toggle-camera').addEventListener('click', () => {
      if (isCameraRunning) stopQuagga();
      else initQuagga();
    });

    window.addEventListener('DOMContentLoaded', () => initQuagga());

    // 表單提交：單筆進貨
    document.getElementById('single-entry-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const payload = [{
        barcode: document.getElementById('barcode').value,
        name: document.getElementById('product-name').value,
        quantity: document.getElementById('quantity').value,
        price: document.getElementById('unit-price').value
      }];
      sendDataToGAS(payload);
    });

    function resetFormToDefault() {
      document.getElementById('single-entry-form').reset();
      document.getElementById('quantity').value = "1";
      lastScannedCode = "";
    }

    // ===== 功能 2: 超強相容 CSV / Excel 讀取引擎 =====
    let batchData = [];

    document.getElementById('excel-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      const isCsv = fileName.endsWith('.csv') || fileName.endsWith('.tsv');

      if (isCsv) {
        readCsvFile(file, 'utf-8', (text) => {
          if (text.includes('')) {
            readCsvFile(file, 'big5', (big5Text) => parseCsvText(big5Text));
          } else {
            parseCsvText(text);
          }
        });
      } else {
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array', raw: false });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { raw: false, defval: '' });
            processRawJsonData(jsonData);
          } catch (err) {
            console.error("Excel 讀取失敗:", err);
            alert("Excel 檔案格式解析失敗！");
          }
        };
        reader.readAsArrayBuffer(file);
      }
    });

    function readCsvFile(file, encoding, callback) {
      const reader = new FileReader();
      reader.onload = (e) => callback(e.target.result);
      reader.readAsText(file, encoding);
    }

    // 智慧動態偵測分隔符號 (逗號、分號、TAB)
    function parseCsvText(csvText) {
      csvText = csvText.replace(/^\uFEFF/, '').trim();
      const lines = csvText.split(/\r\n|\n|\r/);
      if (lines.length === 0) {
        alert("CSV 檔案為空");
        return;
      }

      // 智慧判斷分隔符號：點數最多出現的符號 (逗號 , 、分號 ; 或 TAB \t)
      const firstLine = lines[0];
      const commaCount = (firstLine.match(/,/g) || []).length;
      const semicolonCount = (firstLine.match(/;/g) || []).length;
      const tabCount = (firstLine.match(/\t/g) || []).length;

      let delimiter = ',';
      if (tabCount > commaCount && tabCount > semicolonCount) delimiter = '\t';
      else if (semicolonCount > commaCount && semicolonCount > tabCount) delimiter = ';';

      const headers = parseCsvLine(lines[0], delimiter);
      const jsonData = [];

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const currentLine = parseCsvLine(lines[i], delimiter);
        const row = {};
        headers.forEach((h, index) => {
          row[h] = currentLine[index] !== undefined ? currentLine[index] : '';
        });
        jsonData.push(row);
      }

      processRawJsonData(jsonData);
    }

    function parseCsvLine(line, delimiter) {
      const result = [];
      let start = 0;
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        if (line[i] === '"') {
          inQuotes = !inQuotes;
        } else if (line[i] === delimiter && !inQuotes) {
          let field = line.substring(start, i).trim();
          if (field.startsWith('"') && field.endsWith('"')) {
            field = field.substring(1, field.length - 1).replace(/""/g, '"');
          }
          result.push(field);
          start = i + 1;
        }
      }
      let lastField = line.substring(start).trim();
      if (lastField.startsWith('"') && lastField.endsWith('"')) {
        lastField = lastField.substring(1, lastField.length - 1).replace(/""/g, '"');
      }
      result.push(lastField);
      return result;
    }

    function processRawJsonData(jsonData) {
      batchData = jsonData.map(row => {
        const findValue = (possibleKeys) => {
          for (let originalKey of Object.keys(row)) {
            const cleanKey = originalKey.toString().replace(/[\s\uFEFF\xA0]/g, '').toLowerCase();
            for (let k of possibleKeys) {
              if (cleanKey === k.toLowerCase()) {
                return row[originalKey];
              }
            }
          }
          return '';
        };

        const rawBarcode = findValue(['條碼', 'barcode', '條形碼', '條碼編號', 'code']);
        const rawName = findValue(['商品名稱', '名稱', 'name', '品名', '商品', '項目']);
        const rawQty = findValue(['數量', 'quantity', '進貨數量', 'qty', '數']);
        const rawPrice = findValue(['單價', 'price', '價格', '金額', '售價']);

        return {
          barcode: String(rawBarcode || '').replace(/[\s\uFEFF\xA0]/g, ''),
          name: String(rawName || '').trim(),
          quantity: Number(String(rawQty).replace(/[^\d.]/g, '')) || 1,
          price: Number(String(rawPrice).replace(/[^\d.]/g, '')) || 0
        };
      }).filter(item => item.barcode !== '' || item.name !== '');

      renderPreviewTable(batchData);
    }

    function renderPreviewTable(data) {
      const tbody = document.getElementById('preview-body');
      tbody.innerHTML = '';

      if (data.length === 0) {
        alert("未讀取到有效的表格資料！請確認表格第一行為標題（含有『條碼』與『商品名稱』）。");
        document.getElementById('preview-container').classList.add('hidden');
        return;
      }

      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="px-4 py-2 font-mono">${item.barcode}</td>
          <td class="px-4 py-2 font-medium text-gray-800">${item.name}</td>
          <td class="px-4 py-2">${item.quantity}</td>
          <td class="px-4 py-2">${item.price}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('preview-container').classList.remove('hidden');
    }

    document.getElementById('btn-batch-submit').addEventListener('click', function() {
      if (batchData.length === 0) {
        alert("無可匯入的資料");
        return;
      }
      sendDataToGAS(batchData);
    });

    // ===== 功能 3: 傳送資料至 Google Apps Script API =====
    function sendDataToGAS(dataArray) {
      const btn = document.getElementById('btn-submit-single');
      const batchBtn = document.getElementById('btn-batch-submit');
      
      btn.disabled = true;
      batchBtn.disabled = true;

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(dataArray)
      })
      .then(() => {
        alert('✅ 進貨資料已成功送出！');
        resetFormToDefault();

        document.getElementById('preview-container').classList.add('hidden');
        document.getElementById('excel-file').value = '';
        batchData = [];
      })
      .catch(err => {
        console.error("傳送錯誤：", err);
        alert('⚠️ 傳送失敗：' + err);
      })
      .finally(() => {
        btn.disabled = false;
        batchBtn.disabled = false;
      });
    }
  </script>
</body>
</html>
